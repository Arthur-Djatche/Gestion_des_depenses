<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau Professionnel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"></script>

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
        }
        #pen, #trash{
            margin-right: 20%;
        }
        #pen{
            color: #ffc107;
        }
        #trash{
            color: #dc3545;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            margin-top: 2%;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .header h1 {
            font-size: 22px;
            margin-right: 30%;
            color: #333;
        }
        
        .add-btn {
            background-color: #001F3F;
            color: #fff;
            text-decoration-line: none;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 5%;
            font-weight: 500;
            transition: 0.3s;
        }
        
        .add-btn:hover {
            background-color: #001F3F;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
        }
        
        thead {
            background-color: #001F3F;
            color: #fff;
        }
        
        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        tbody tr:hover {
            background-color: #f1f5ff;
            transition: background 0.2s;
        }
        
        .action-btns {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn.modify {
            background-color: #ffc107;
            color: #fff;
        }
        
        .btn.modify:hover {
            background-color: #e0a800;
        }
        
        .btn.delete {
            background-color: #dc3545;
            color: #fff;
        }
        
        .btn.delete:hover {
            background-color: #b52a36;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            th,
            td {
                font-size: 14px;
                padding: 10px;
            }
            .header h1 {
                font-size: 18px;
            }
            .add-btn {
                padding: 8px 15px;
                font-size: 14px;
            }
        
        }
        .select{
                margin-right: 3%;
                width: 18%;
        }
        select{
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #001F3F;
        }
        .select label{
            font-weight: 600;
            margin-right: 1%;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Liste des Catégories</h1>
            <a class="add-btn" href="principal.html">Mes dépenses</a>
            <a href="ajout_catégorie.html" class="add-btn">+ Ajouter une catégorie</a href="ajout_catégorie.html">
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Nombre de dépenses</th>
                    <th>Montant des dépenses</th>
                    <th>Montant restant</th>
                    <th>Actions</th>
            </thead>

            <tbody>
                <tr>
                    <td>Education</td>
                    <td>4</td>
                    <td>40000 FCFA</td>
                    <td>20 000 FCFA</td>
                    <td><a href="ajout_catégorie.html"><i class="fa-solid fa-pen" id="pen"></i></a><a href="ajout_catégorie.html"><i class="fa-solid fa-trash" id="trash"></i></a></td>
                    
                </tr>

                <tr>
                    <td>Education</td>
                    <td>0</td>
                    <td>0 FCFA</td>
                    <td>40 000 FCFA</td>
                    <td><a href="ajout_catégorie.html"><i class="fa-solid fa-pen" id="pen"></i></a><a href="ajout_catégorie.html"><i class="fa-solid fa-trash" id="trash"></i></a></td>
                    
                </tr>

                <tr>
                    <td>Alimentation</td>
                    <td>22</td>
                    <td>400 000 FCFA</td>
                    <td>100 000</td>
                    <td><a href="ajout_catégorie.html"><i class="fa-solid fa-pen" id="pen"></i></a> <a href="ajout_catégorie.html"><i class="fa-solid fa-trash" id="trash"></i></a></td>
                    
                </tr>

                </tr>
            </tbody>
        </table>
    </div>

</body>

</html>
